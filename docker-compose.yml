version: "3.8"

services:
  frontend:
    build: .
    image: arancia-frontend:latest
    restart: always
    ports:
      - "${VITE_PORT:-3002}:80"
    environment:
      NODE_ENV: "${NODE_ENV:-production}"
      VITE_API_URL: "${VITE_API_URL:-http://arancia-api-dev.nauvolan.abrdns.com/api}"
      VITE_APP_NAME: "${VITE_APP_NAME:-Arancia}"
      VITE_APP_VERSION: "${VITE_APP_VERSION:-0.1.0}"
      VITE_PORT: "${VITE_PORT:-3002}"
      VITE_BASE_URL: "${VITE_BASE_URL:-/}"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.arancia-frontend.rule=Host(`arancia-dev.nauvolan.abrdns.com`)"
      - "traefik.http.routers.arancia-frontend.entrypoints=websecure"
      - "traefik.http.routers.arancia-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.arancia-frontend.loadbalancer.server.port=80"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
    name: dokploy-network